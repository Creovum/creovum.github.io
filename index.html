<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#090d13">
  <meta name="description" content="Creovum — independent app development. Find privacy information for NITE.">
  <title>Creovum | Digital Studio</title>
  <style>
    :root{color-scheme:dark;--jade:#10b981;--text:#eef3f7;--sub:#a2afbc;--line:#25313c}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse 60% 40% at 80% 5%,#103d38 0,transparent 80%),#090d13;color:var(--text);font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    main{max-width:860px;margin:auto;padding:54px 26px 110px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px} .brand{font-size:21px;letter-spacing:.10em;font-weight:850;text-decoration:none;color:var(--text)}.brand i{font-style:normal;color:var(--jade)}.label{font-size:11px;letter-spacing:.27em;color:var(--sub)}h1{font-size:clamp(44px,8vw,68px);line-height:1.1;letter-spacing:-.05em;margin:110px 0 18px}h1 span{color:var(--jade)}p{color:var(--sub);max-width:680px}.card{display:block;background:linear-gradient(135deg,#16262c,#10161d 70%);border:1px solid #24413e;border-radius:20px;padding:28px;margin-top:44px;text-decoration:none;color:inherit;transition:border-color .2s}.card:hover{border-color:var(--jade)}.eyebrow{font-size:12px;color:var(--jade);font-weight:700;letter-spacing:.12em;text-transform:uppercase}.card h2{font-size:28px;margin:10px 0 6px}.card p{margin:0}.more{color:var(--jade);margin-top:20px;display:inline-block;font-weight:650}footer{margin-top:65px;border-top:1px solid var(--line);padding-top:22px;font-size:12px;color:var(--sub)}
  </style>
</head>
<body>
  <main>
    <header><a class="brand" href="/">CREOVUM<i>.</i></a><div class="label">DIGITAL STUDIO</div></header>
    <h1>Thoughtfully made<span>.</span></h1>
    <p>Small, focused Android experiences. Useful by design, simple to use.</p>
    <a class="card" href="/nite/privacy-policy/" aria-label="Read NITE Privacy Policy">
      <span class="eyebrow">Android app</span><h2>NITE</h2>
      <p>Time, after dark.</p><span class="more">Privacy Policy &rarr;</span>
    </a>
    <footer>&copy; 2026 Creovum. Independent app development.</footer>
  </main>
</body>
</html>
